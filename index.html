<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#990000">
<meta name="description" content="Portal de padres del Colegio Jerome Bruner">

<title>Comunidad JB</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="./iconos/icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Comunidad JB">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="./css/estilos.css">
</head>
<body>

<div class="app">

  <!-- Las dos tiras de arriba. Solo se ven ya adentro:
       la de avisos cuando hay algo sin leer, y la de instalar
       mientras no haya instalado. -->
  <div class="tira oculto" id="tiraAvisos"></div>
  <div class="tira oculto" id="tiraInstalar"></div>

  <!-- Encabezado grande: se ve antes de entrar -->
  <div class="enc" id="enc">
    <div class="escudo"><img src="./iconos/icono-192.png" alt="Colegio Jerome Bruner"></div>
    <div class="cole" id="encColegio">COLEGIO JEROME BRUNER</div>
    <div class="ciclo" id="encCiclo">Ciclo escolar 2026 – 2027</div>
    <div class="etiq" id="encEtiqueta">Comunidad JB</div>
  </div>

  <!-- Barra chica: se ve ya adentro, con el hijo seleccionado -->
  <div class="barra" id="barra">
    <div>
      <div class="quien" id="barraNombre"></div>
      <div class="sub" id="barraGrupo"></div>
    </div>
    <button class="ham" id="barraMenu" aria-label="Menú">&#9776;</button>
  </div>

  <div class="cuerpo" id="cuerpo">
    <div class="cargando">Cargando…</div>
  </div>

  <!-- Las cinco pestañas: solo aparecen con un hijo seleccionado -->
  <div class="tabs" id="tabs">
    <button class="tab on" data-t="calificaciones"><span class="ic">&#128218;</span>Califica&shy;ciones</button>
    <button class="tab" data-t="pagos"><span class="ic">&#128179;</span>Pagos</button>
    <button class="tab" data-t="cooperativa"><span class="ic">&#127869;</span>Coopera&shy;tiva</button>
    <button class="tab" data-t="calendario"><span class="ic">&#128197;</span>Calen&shy;dario</button>
    <button class="tab" data-t="credencial"><span class="ic">&#127380;</span>Creden&shy;cial</button>
  </div>

  <div class="pie" id="pie"></div>
</div>

<!-- El orden importa: config primero, app al final (es el que arranca). -->
<script src="./js/config.js"></script>
<script src="./js/api.js"></script>
<script src="./js/instalar.js"></script>
<script src="./js/avisos.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
